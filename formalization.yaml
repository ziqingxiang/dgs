status:
  scope: >-
    Formalized: Theorem 1.1 of the paper with its complete proof, including the four results that the paper quotes from the literature (Kneser's theorem, the theorem of Johnson and Newman, and the cases used of the theorems of Tao-Vu and O'Rourke-Touri). The statement concerns labelled graphs: for each n it counts the graphs on the vertex set Fin n = {0, ..., n-1}, equivalently the uniformly random graph G(n, 1/2), exactly as Theorem 1.1. The paper remarks after Theorem 1.1 that the same conclusion holds for a uniformly random unlabelled graph, by the theorem of Erdős and Rényi that almost all graphs are asymmetric; this consequence is not formalized. The generalized spectrum is expressed through characteristic polynomials: two graphs on Fin n have the same generalized spectrum when their integer adjacency matrices have the same characteristic polynomial and so do the adjacency matrices of their complements. For real symmetric matrices this is equality of spectra with multiplicities, so the formal definition is the usual notion. Determination by the generalized spectrum quantifies over all graphs on the same vertex set Fin n and asks for a graph isomorphism. Small n are irrelevant to the limit. The proof uses no axioms beyond propext, Quot.sound and Classical.choice, and contains no sorry; Challenge.lean contains one deliberate sorry, the statement placeholder.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

automation:
  methods:
    - method: agent
      models:
        - "Claude Opus 5.5 (Anthropic)"
      framework: "Claude (Anthropic) agent sessions with a shell, the Lean toolchain and a local build of Mathlib"
      tool_setup: >-
        AI-assisted formalization: an AI agent wrote all the Lean code and compiled every file with Lean, under the direction of the author, who set the plan, made the decisions on statements and scope, and reviewed the main statement.
      cost:
        wall_time: "about five days"
        spend_usd: "not tracked"
        hardware: "cloud workspace with 2 CPUs and 8 GB of memory"
      prompting_notes: >-
        The agent followed the paper section by section, stated every numbered result of the paper in Lean before proving it.
  spend_usd: "not tracked"
  notes: >-
    The Lean formalization was produced by an AI agent (Claude, Anthropic) working from the paper under the author's direction; the author chose the formal statement together with the agent and reviewed it. Every Lean file was compiled with all warnings treated as errors, and the kernel replay of all declarations (leanchecker) and Comparator, with Lean's kernel and NanoDa, were run before submission.

fidelity:
  divergences: >-
    None known for the statement: DGSMain.almost_all_graphs_are_DGS is Theorem 1.1 of the paper (for labelled graphs, as in the paper). The proof follows the architecture of the paper, but departs from it in places that do not affect the statement: some constants and parameters differ, several arguments are reorganized or replaced by equivalent ones, and the theorems of Tao-Vu and O'Rourke-Touri, which the paper quotes, are proved here by a new argument instead.

review:
  status: "self-assessed"
  reviewers:
    - "Ziqing Xiang"
  notes: >-
    The author, who wrote the paper, reviewed the formal statement in Challenge.lean and its definitions. The proofs were checked by Lean, by a kernel replay of all declarations, and by Comparator with Lean's kernel and NanoDa. No independent human review of the Lean proofs has been performed.

alignment:
  namespace: "DGSMain"
  statements:
    - source: "Theorem 1.1"
      lean: "DGSMain.almost_all_graphs_are_DGS"
      module: "Challenge"
      status: "proved"
      note: >-
        The proportion of the graphs on Fin n that are DGS tends to 1, which is the probability statement of Theorem 1.1 for G(n, 1/2). The definitions adj, SameGenSpectrum and IsDGS in Challenge.lean express the adjacency matrix, the generalized spectrum through characteristic polynomials, and determination by the generalized spectrum.

